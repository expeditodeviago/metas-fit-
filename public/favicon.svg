<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mm-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="55%" stop-color="#FC4C02"/>
      <stop offset="100%" stop-color="#D93800"/>
    </linearGradient>
    <linearGradient id="mm-sheen" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
